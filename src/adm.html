<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Gerenciador de Usuários · Página inicial</title>
    </head>

    <body>
        <div class="adm-container">
            <h2>Usuários cadastrados</h2>
            <h3>Monitoramento em Tempo Real LED</h3>
            <div id="led"
                style ="
                width:120px;
                height:120px;
                border-radius:50%;
                background-color:gray;
                display:flex;
                align-items:center;
                justify-content:center;
                color:white;
                font-weight:bold;
                margin-bottom:20px;
            ">
            OFFLINE
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="downloadPDF()" style="background-color: #2ea043;">Baixar Relatório em PDF</button>
                <button onclick="exportarCSV()" style="background-color: #007bff;">Exportar CSV</button>
                <button onclick="baixarMonitoramento()" style="background-color: #f39c12;">Relatório de monitoramento</button>
            </div>
            
            <div id="registers-list"></div>
            <button id="btn-back" onclick="window.location.href='main-page.html'">Voltar</button>
         </div>

         <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 9999; background: rgba(255, 255, 255, 0.85); padding: 10px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(5px);">
            <video width="120" height="120" autoplay loop muted playsinline style="border-radius: 10px; pointer-events: none; object-fit: cover;">
                <source src="/stream" type="video/mp4">
            </video>
            <p style="margin: 5px 0 0 0; font-size: 14px; font-weight: bold; color: #ff69b4; font-family: sans-serif;">feito com 💗</p>
        </div>
        
         <script src="view.js"></script>
    </body>
</html>
