<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Meu Perfil</title>
    </head>

    <body>
        <div class="user-container">
            <h2>Meu Perfil</h2>
            
            <div id="dados-perfil" style="margin-bottom: 20px; text-align: left;">
                <p>Carregando seus dados...</p>
            </div>

            <button id="btn-back" onclick="window.location.href='main-page.html'">Voltar para Home</button>
            <button onclick="sair()" style="background-color: #cf222e; margin-top: 10px;">Sair da Conta</button>
        </div>

        <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 9999; background: rgba(255, 255, 255, 0.85); padding: 10px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(5px);">
            <video width="120" height="120" autoplay loop muted playsinline style="border-radius: 10px; pointer-events: none; object-fit: cover;">
                <source src="/stream" type="video/mp4">
            </video>
            <p style="margin: 5px 0 0 0; font-size: 14px; font-weight: bold; color: #ff69b4; font-family: sans-serif;">feito com 💗</p>
        </div>
        
        <script src="view.js"></script>
    </body>
</html>
