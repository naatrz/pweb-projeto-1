<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Gerenciador de Usuários · Página inicial</title>
    </head>

    <body>
        <div class="home-page-container">
            <h2>Gerenciador de Usuários</h2>
            <p>Faça login ou cadastre-se:</p>
            <button onclick="window.location.href='sign-up.html'">Novo cadastro</button>
            <button onclick="window.location.href='login.html'">Login</button>
        </div>

        <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 9999; background: rgba(255, 255, 255, 0.85); padding: 10px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(5px);">
            <video width="120" height="120" autoplay loop muted playsinline style="border-radius: 10px; pointer-events: none; object-fit: cover;">
                <source src="/stream" type="video/mp4">
            </video>
            <p style="margin: 5px 0 0 0; font-size: 14px; font-weight: bold; color: #ff69b4; font-family: sans-serif;">feito com 💗</p>
        </div>

        <script src="/socket.io/socket.io.js"></script>

        <div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: rgba(255, 255, 255, 0.9); padding: 10px 15px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; font-family: sans-serif; backdrop-filter: blur(5px);">
            <span style="font-size: 14px; font-weight: bold; color: #333;">Servidor:</span>
            <div id="led-virtual" style="width: 15px; height: 15px; border-radius: 50%; background-color: gray; transition: 0.3s;"></div>
            <span id="led-texto" style="font-size: 12px; font-weight: bold; color: gray;">OFFLINE</span>
        </div>

        <script>
            // Conecta ao servidor Socket
            const socketLED = io();
            
            // Escuta o evento 'led' enviado pelo server.js
            socketLED.on('led', (dados) => {
                const bolinha = document.getElementById('led-virtual');
                const texto = document.getElementById('led-texto');
                
                if (dados.status) {
                    bolinha.style.backgroundColor = '#2ea043'; // Fica verde
                    bolinha.style.boxShadow = '0 0 10px #2ea043'; // Efeito de brilho
                    texto.style.color = '#2ea043';
                    texto.innerText = 'ONLINE';
                } else {
                    bolinha.style.backgroundColor = 'gray'; // Apaga
                    bolinha.style.boxShadow = 'none';
                    texto.style.color = 'gray';
                    texto.innerText = 'OFFLINE';
                }

            // Se o servidor cair ou a internet desconectar, apaga o LED na hora!
            socketLED.on('disconnect', () => {
                const bolinha = document.getElementById('led-virtual');
                const texto = document.getElementById('led-texto');
                bolinha.style.backgroundColor = 'gray';
                bolinha.style.boxShadow = 'none';
                texto.style.color = 'gray';
                texto.innerText = 'OFFLINE';
            });
            });
        </script>

    </body>
</html>
